<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05a66b"/>
      <stop offset="100%" stop-color="#1677c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f334d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#f6f8fb"/>
  <rect x="0" y="0" width="640" height="58" fill="url(#top)"/>
  <text x="28" y="38" font-size="24" font-weight="700" font-family="Helvetica, Arial, sans-serif" fill="#ffffff">INIAD Plus</text>
  <text x="612" y="36" text-anchor="end" font-size="15" font-weight="700" font-family="Helvetica, Arial, sans-serif" fill="#ffffff">MOOCs PDF Helper</text>

  <g transform="translate(28 84)">
    <text x="0" y="0" font-size="24" font-weight="700" font-family="Helvetica, Arial, sans-serif" fill="#1d2939">INIAD MOOCs の講義スライドを PDF 保存</text>
    <text x="0" y="30" font-size="15" font-family="Helvetica, Arial, sans-serif" fill="#52677f">講義ページにボタンを追加して、Google Slides の資料をローカルに保存します。</text>
  </g>

  <g transform="translate(28 144)" filter="url(#shadow)">
    <rect x="0" y="0" width="584" height="208" rx="10" fill="#ffffff"/>
    <rect x="0" y="0" width="584" height="38" rx="10" fill="#f0f4f8"/>
    <text x="20" y="25" font-size="15" font-weight="700" font-family="Helvetica, Arial, sans-serif" fill="#2f3b4a">Lecture Page</text>
    <rect x="20" y="62" width="180" height="116" rx="8" fill="#e8eef5"/>
    <rect x="42" y="82" width="136" height="72" rx="4" fill="#ffffff"/>
    <rect x="56" y="98" width="88" height="8" rx="4" fill="#1677c9"/>
    <rect x="56" y="116" width="110" height="7" rx="3.5" fill="#8aa2bd"/>
    <rect x="56" y="132" width="92" height="7" rx="3.5" fill="#8aa2bd"/>

    <text x="230" y="78" font-size="20" font-weight="700" font-family="Helvetica, Arial, sans-serif" fill="#1d2939">講義スライド資料</text>
    <text x="230" y="108" font-size="15" font-family="Helvetica, Arial, sans-serif" fill="#52677f">1ページ1スライド / A4横でPDF化</text>
    <rect x="230" y="132" width="218" height="44" rx="8" fill="#05a66b"/>
    <text x="339" y="160" text-anchor="middle" font-size="15" font-weight="700" font-family="Helvetica, Arial, sans-serif" fill="#ffffff">スライドを学習用PDFにする</text>

    <rect x="472" y="62" width="74" height="116" rx="8" fill="#fff4e5"/>
    <text x="494" y="118" font-size="30" font-weight="700" font-family="Helvetica, Arial, sans-serif" fill="#f59e0b">PDF</text>
  </g>
</svg>
